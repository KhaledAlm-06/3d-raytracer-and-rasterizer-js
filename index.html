<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Computer Graphics From Scratch (Raytracer + Rasterizer)</title>
  <style>
    body { margin: 0; background: #0d1117; color: #e6edf3; font-family: system-ui, sans-serif; padding: 20px; }
    .grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    .panel { display: flex; flex-direction: column; align-items: center; }
    canvas { border: 1px solid #30363d; border-radius: 8px; }
    h3 { margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Gabriel Gambetta: Computer Graphics from Scratch</h2>
  <div class="grid">
    <div class="panel">
      <h3>Part I: Raytracer (Reflections & Shadows)</h3>
      <canvas id="ray" width="360" height="300"></canvas>
    </div>
    <div class="panel">
      <h3>Part II: Rasterizer (Clipped Cubes & 1/Z Buffer)</h3>
      <canvas id="rast" width="360" height="300"></canvas>
    </div>
  </div>
  <script src="main.js"></script>
  <script>
    const { Vec3, Mat4, CanvasBuffer, GambettaRaytracer, GambettaRasterizer } = window.CGFromScratch;
    const rayCanvas = document.getElementById("ray");
    const rayCtx = rayCanvas.getContext("2d");
    const rayBuf = new CanvasBuffer(rayCanvas.width, rayCanvas.height);
    const raytracer = new GambettaRaytracer();
    raytracer.render(rayBuf, new Vec3(0, 0, 0), 3);
    rayCtx.putImageData(new ImageData(rayBuf.pixels, rayCanvas.width, rayCanvas.height), 0, 0);

    const rastCanvas = document.getElementById("rast");
    const rastCtx = rastCanvas.getContext("2d");
    const rastBuf = new CanvasBuffer(rastCanvas.width, rastCanvas.height);
    const rasterizer = new GambettaRasterizer();
    const cube = GambettaRasterizer.createCubeModel();
    let angle = 0;

    function animate() {
      rastBuf.clear([12, 16, 24]);
      const m1 = Mat4.translation(-1.4, 0, 6.8).multiply(Mat4.rotationY(angle)).multiply(Mat4.rotationX(angle * 0.6));
      const m2 = Mat4.translation(1.5, 0, 7.2).multiply(Mat4.rotationY(-angle * 1.2)).multiply(Mat4.rotationX(25));
      rasterizer.renderInstance(cube, m1, rastBuf);
      rasterizer.renderInstance(cube, m2, rastBuf);
      rastCtx.putImageData(new ImageData(rastBuf.pixels, rastCanvas.width, rastCanvas.height), 0, 0);
      angle += 1.2;
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
